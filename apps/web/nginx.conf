# nginx for the CrisisLink web container.
# Serves the built single-page app and forwards API + live-update traffic to the API container,
# so the browser sees ONE origin (no CORS, SameSite cookies just work).

upstream api {
  server api:4000; # the `api` service in docker-compose.yml
}

# Socket.IO needs the HTTP "Upgrade" handshake passed through to become a WebSocket.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Hide the nginx version; compress text responses.
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # CONTENT SECURITY POLICY: the browser refuses to run or load anything not on this list,
  # so even if someone manages to inject HTML, injected scripts don't run.
  # 'unsafe-inline' for styles is needed by Leaflet's positioning; scripts stay strict.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # real client IP for rate limits
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id; # one id across nginx and API logs
  }

  location /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h; # live connections stay open
  }

  # Caching uses `expires`, NOT add_header: an add_header inside a location silently drops
  # every add_header inherited from the server block - including the security headers above.

  # Hashed build files (index-3f9a1c.js) never change: cache for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The service worker and index.html must always be revalidated, or users get stuck on an
  # old version of the app.
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }
  location = /index.html {
    expires -1;
  }

  # Single-page app: unknown paths (/camps/123) get index.html; React Router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
